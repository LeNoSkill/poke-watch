name: watch-30-anniversaire

on:
  schedule:
    - cron: "*/5 * * * *"     # toutes les 5 minutes
  workflow_dispatch: {}         # + bouton "Run workflow" pour tester a la main

permissions:
  contents: write               # pour sauvegarder l'etat (state.json) dans le repo

concurrency:
  group: watch-30
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Lancer la surveillance
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py

      - name: Sauvegarder l'etat si change
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "poke-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "maj etat surveillance"
            git push
          else
            echo "Aucun changement d'etat."
          fi
